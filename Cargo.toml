[package]
name = "cache"
version = "0.1.0"
edition = "2021"

[features]
default = ["persistent", "oci"]
# Persistent and tiered backends on top of `key-value-storage`.
persistent = ["dep:key-value-storage"]
# Preloading from OCI registries and image layouts, with signature
# verification, plus tooling to build, sign and push bundles.
oci = ["dep:base64", "dep:hex", "dep:openssl", "dep:reqwest", "dep:serde_json", "dep:sha2"]

[dependencies]
async-trait.workspace = true
base64 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
key-value-storage = { path = "../key-value-storage", default-features = false, optional = true }
openssl = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["default-tls"], optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
openssl.workspace = true
rstest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
